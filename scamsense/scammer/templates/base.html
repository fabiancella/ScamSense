
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ScamSense{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="light-mode"> <!-- Default to light mode -->

    <!-- Navbar (Same for All Pages) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light w-100">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="{% url 'home' %}">
                <img src="{% static 'images/ScamSense_Logo-Photoroom.png' %}" alt="ScamSense Logo" class="logo-img me-2">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">Contact</a>
                    </li>
                </ul>
                <button id="dark-mode-toggle" class="btn btn-secondary ms-3">🌙 Dark Mode</button>
            </div>
        </div>
    </nav>

    <!-- Page Content (Changes for Each Page) -->
    <div class="container text-center p-4 border-0 shadow-sm">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/darkmode.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let messageInput = document.getElementById("messageInput");
            let submitBtn = document.getElementById("submitBtn");
            let messageForm = document.getElementById("messageForm");

            if (messageInput && submitBtn && messageForm) {
                console.log("JavaScript detected message input!");

                messageInput.addEventListener("keypress", function (event) {
                    console.log("Key pressed: ", event.key);
                    if (event.key === "Enter" && !event.shiftKey) {
                        event.preventDefault();
                        console.log("Submitting form...");
                        messageForm.submit();
                    }
                });
            }});
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
